# Netlify configuration
# =============================================================================
# The site is plain static HTML, so there is nothing to build — Netlify just
# publishes the repository root. The functions directory is declared so the
# optional investor-assistant endpoint is picked up if it is ever enabled.

[build]
  publish = "."
  command = ""
  functions = "functions"

# --- Assistant endpoint ------------------------------------------------------
# The front end calls /api/agent in both environments. Locally dev-server.py
# answers that path directly; here it is forwarded to the function, so the same
# JavaScript works in development and production with no build-time switch.
# The function is inert until ANTHROPIC_API_KEY is set in the Netlify dashboard
# and the assistant falls back to its knowledge base, so this is safe to ship
# before the key exists.

[[redirects]]
  from = "/api/agent"
  to = "/.netlify/functions/agent"
  status = 200
  force = true

# --- Retired pages -----------------------------------------------------------
# Portfolio and the insights hub were published and are indexed, so the old
# URLs are redirected rather than left to 404. 301 tells search engines the
# move is permanent and passes the accumulated signal to the destination.

[[redirects]]
  from = "/portfolio.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/insights"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/insights/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/disclosures.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/"
  status = 301
  force = true

# --- Caching -----------------------------------------------------------------
# Stylesheet and script URLs carry a ?v= query that is bumped on every change,
# so they can be cached hard. Media has no version in its filename, so it gets
# a week — long enough to matter, short enough that a replaced photograph
# reaches people without a rename.

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML is always revalidated, so a content edit is live on the next request
# rather than whenever a stale copy happens to expire.

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
